/* ─── Shell: the first-run window. Text is --fg or --meta; brand is --accent-soft / --accent-soft-on. ─── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { min-width: 720px; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: var(--text-base); line-height: 21px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
p { margin: 0; text-wrap: pretty; }
::selection { background: var(--accent-soft); color: var(--accent-soft-on); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.strip { display: flex; gap: 28px; height: 44px; padding: 0 var(--container-gutter-desktop); background: var(--surface-warm); border-bottom: 1px solid var(--border); }
.strip span { display: flex; align-items: center; gap: 8px; margin-bottom: -1px; border-bottom: 2px solid transparent; font-size: var(--text-xs); color: var(--meta); white-space: nowrap; }
.strip span b { font-family: var(--font-mono); font-weight: 400; }
.strip .done { color: var(--fg); }
.strip .cur { color: var(--fg); border-bottom-color: var(--accent-soft-on); }
main { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
/* The field's focus ring draws 4px outside its border box on all four sides. Below it, the head keeps
   16px (--space-4) before the scroll container, so the ring clears the sticky list header with 12px to
   spare. Above it, the sentence is 16px away. Beside it, the 24px gutter is 20px more than the ring
   needs; the head's right padding also carries the list's 8px scrollbar gutter so field and rows align. */
.head { padding: 28px calc(var(--container-gutter-desktop) + var(--space-2)) var(--space-4) var(--container-gutter-desktop); }
.col { width: 100%; max-width: 1000px; margin: 0 auto; }
h1 { margin: 0 0 4px; font-size: var(--text-2xl); line-height: 31px; font-weight: 600; letter-spacing: var(--tracking-display); text-wrap: balance; }
.sub { color: var(--meta); font-size: var(--text-base); line-height: 21px; }
.scroll { overflow-y: auto; min-height: 0; padding: 0 var(--container-gutter-desktop) 24px; scrollbar-gutter: stable; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
footer { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px var(--container-gutter-desktop); background: var(--surface-warm); border-top: 1px solid var(--border); }
footer .read { flex: 1 1 auto; min-width: 0; font-size: var(--text-xs); line-height: 17px; color: var(--meta); }
footer .read b { font-weight: 500; color: var(--fg); }
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; font-size: var(--text-sm); font-weight: 500; line-height: 1; white-space: nowrap; cursor: pointer; transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled { cursor: not-allowed; opacity: 0.45; }
.btn-primary { background: var(--accent-soft); color: var(--accent-soft-on); }
.btn-primary:hover:not(:disabled) { border-color: var(--accent-soft-on); }
.btn-secondary { background: var(--surface-sunken); border-color: var(--border-strong); color: var(--fg); }
.btn-secondary:hover:not(:disabled) { border-color: var(--fg); }
.btn-ghost { color: var(--fg); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-sunken); }
.well { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: var(--surface-sunken); border: 1px solid var(--border-strong); border-radius: var(--radius-md); transition: border-color var(--motion-fast) var(--ease-standard); }
.well:hover { border-color: var(--fg); }
.well:focus-within { border-color: var(--accent-soft-on); box-shadow: var(--focus-ring); }
.well input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-size: var(--text-base); }
.well input::placeholder { color: var(--meta); opacity: 1; }
.well.sm { height: 36px; padding: 0 10px; }

.dot { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--bg); }
.on > .dot, .on .dot.me { border-color: var(--accent-soft-on); background: radial-gradient(circle, var(--accent-soft-on) 0 4px, transparent 4.5px); }
.quiet { color: var(--meta); }
.status { color: var(--accent-soft-on); font-weight: 500; }

.search { margin-top: var(--space-4); }
.rows { display: grid; }
.rhead, .row { display: grid; grid-template-columns: 16px minmax(0, 1.4fr) 84px 112px minmax(0, 1.6fr); column-gap: 14px; align-items: center; padding: 0 8px 0 12px; }
.rhead { position: sticky; top: 0; z-index: 1; height: 28px; background: var(--bg); border-bottom: 1px solid var(--border-strong); font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--meta); }
.row { min-height: 40px; padding-top: 7px; padding-bottom: 7px; border-bottom: 1px solid var(--border); cursor: pointer; }
.row:hover { background: var(--surface-sunken); }
.row:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.row.on { box-shadow: inset 2px 0 0 var(--accent-soft-on); }
.row .id { font-family: var(--font-mono); font-size: var(--text-sm); line-height: 19px; color: var(--fg); overflow-wrap: anywhere; }
.row .size, .row .how { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--meta); white-space: nowrap; }
.row .langs { font-size: var(--text-sm); line-height: 19px; color: var(--fg); }
.empty { padding: 24px 0; font-size: var(--text-sm); color: var(--meta); }
@media (max-width: 899px) {
  .rhead { display: none; }
  .row { grid-template-columns: 16px minmax(0, 1fr) 84px; grid-template-rows: auto auto; row-gap: 2px; }
  .row .how { grid-column: 3; grid-row: 2; }
  .row .langs { grid-column: 2; grid-row: 2; }
}

  const EXPLICIT = [
    { id: 'parakeet-tdt-0.6b-v3-q8', family: 'Parakeet', streaming: false, mb: 740, wer: 1.94, set: LS, langs: EU25, desc: 'NVIDIA transducer, 25 European languages. The default.', rec: true, def: true },
    { id: 'nemotron-3.5-asr-streaming-0.6b-q8', family: 'Nemotron', streaming: true, mb: 716, wer: 3.06, set: LS, langs: NEM.list, n: 32, desc: 'NVIDIA streaming model, 32 languages.', rec: true },
    { id: 'moonshine-streaming-small-q8', family: 'Moonshine Streaming', streaming: true, mb: 189, wer: 2.54, set: LS, langs: ['en'], desc: 'Useful Sensors streaming model, English only. Word-by-word text.', rec: true },
    { id: 'moonshine-tiny-q8', family: 'Moonshine', streaming: false, mb: 34, wer: 4.60, set: LS, langs: ['en'], desc: 'Useful Sensors batch model, English only. The smallest recommended.', rec: true },
    { id: 'gigaam-v3-ctc-q8', family: 'GigaAM', streaming: false, mb: 259, wer: 5.36, set: FL, langs: ['ru'], desc: 'Sber model trained on Russian speech. Russian only.' },
    { id: 'gigaam-v3-rnnt-q8', family: 'GigaAM', streaming: false, mb: 261, wer: 5.50, set: FL, langs: ['ru'], desc: 'Sber model trained on Russian speech. Russian only.' },
    { id: 'gigaam-v2-ctc-q8', family: 'GigaAM', streaming: false, mb: 260, wer: 5.83, set: FL, langs: ['ru'], desc: 'Sber model trained on Russian speech, earlier release. Russian only.' },
    { id: 'gigaam-v2-rnnt-q8', family: 'GigaAM', streaming: false, mb: 261, wer: 6.12, set: FL, langs: ['ru'], desc: 'Sber model trained on Russian speech, earlier release. Russian only.' }
  ];
  const CATALOGUE = EXPLICIT.concat(FAM.flatMap(([family, base, s, f16, wer, set, langs, quants, desc, diar]) => quants.split(' ').map(q => ({
    id: `${base}-${q}`, family, streaming: !!s, mb: Math.round(f16 * Q[q][0]), wer: +(wer + Q[q][1]).toFixed(2), set,
    langs: langs.list || langs, n: langs.n, desc, diar: !!diar
  }))));

  const sub = c => c.split('-')[0].toLowerCase();
  const has = (m, code) => m.langs.some(c => sub(c) === code);
  const count = m => m.n || m.langs.length;
  const names = m => m.langs.map(c => LANG[sub(c)] || sub(c));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ROWS = CATALOGUE.slice().sort((a, b) => a.family.localeCompare(b.family) || a.mb - b.mb || a.id.localeCompare(b.id));
  // One input. The query matches a model id, a family, a language name or a language code.
  const st = { q: '', model: null };
  const queryLang = () => { const q = st.q.trim().toLowerCase(); return q ? (Object.keys(LANG).find(c => c === q || LANG[c].toLowerCase() === q) || '') : ''; };
  const langWords = m => {
    const k = count(m), f = queryLang();
    if (k <= 4) return esc(names(m).join(', '));
    return `${k} languages${f && has(m, f) ? `, incl. ${LANG[f]}` : ''}`;
  };
  const matches = m => {
    const q = st.q.trim().toLowerCase();
    return !q || m.id.toLowerCase().includes(q) || m.family.toLowerCase().includes(q) || m.langs.some(c => sub(c) === q || (LANG[sub(c)] || '').toLowerCase().includes(q));
  };
  const rowHTML = m => { const on = st.model === m.id; return `<div class="row${on ? ' on' : ''}" role="radio" aria-checked="${on}" tabindex="0" data-id="${m.id}"><span class="dot" aria-hidden="true"></span><span class="id">${m.id}</span><span class="size">${m.mb} MB</span><span class="how">${m.streaming ? 'word by word' : 'in chunks'}</span><span class="langs">${langWords(m)}</span></div>`; };
  const $ = s => document.querySelector(s);
  function renderList() {
    const shown = ROWS.filter(matches);
    $('[data-rows]').innerHTML = shown.length
      ? `<div class="rhead" aria-hidden="true"><span></span><span>Model</span><span>Download</span><span>Text arrives</span><span>Languages</span></div>${shown.map(rowHTML).join('')}`
      : `<div class="empty">Nothing matches. Try a language, such as Russian or ru, or part of a model name.</div>`;
    const m = CATALOGUE.find(x => x.id === st.model);
    $('[data-read]').innerHTML = m ? `<b>${m.id}</b> · ${m.mb} MB · text arrives ${m.streaming ? 'word by word' : 'in chunks'}` : 'Pick a model to continue.';
    $('[data-next]').disabled = !m;
  }
  document.addEventListener('click', e => { const r = e.target.closest('.row'); if (r) { st.model = r.dataset.id; renderList(); } });
  document.addEventListener('keydown', e => { const r = e.target.closest('.row'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); st.model = r.dataset.id; renderList(); } });
  $('[data-q]').addEventListener('input', e => { st.q = e.target.value; renderList(); });
  renderList();
})();
</script>
</body>
</html>
