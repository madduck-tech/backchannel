name: Tests

# The suites nothing used to run (issue #1): frontend unit tests, the TypeScript
# typecheck, and the Rust workspace tests. Linux only (ADR 0005). The apt and
# sidecar steps mirror build-linux.yml, because the app's build script requires
# the llama-helper sidecar and the webkit2gtk headers even for `cargo test`.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Frontend and Rust suites
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The exact version, matching frontend/package.json's `packageManager` pin — not the
      # major (#42, ADR 0019). The action reads $GITHUB_WORKSPACE/package.json, which does not
      # exist here, so it never sees that pin by itself, and `version: 11` let CI float within
      # the major while corepack held a developer at 11.25.0. Do not add package_json_file
      # instead: the action refuses when the pin and `version` differ, so these two numbers
      # have to be changed together and this comment is the reminder.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      # `node-version-file`, not a literal: `.nvmrc` is the one place the number lives, so a
      # developer's `nvm use` and this job cannot drift (#42, ADR 0019). They had: this said
      # '22' while every measurement in this repository was made on 24, which meant `pnpm test`
      # and `pnpm lint` results were produced by a different runtime than the one that gates a
      # pull request. Same defect as the rustc skew ADR 0018 was written about, one language over.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # No `@stable` here: `rust-toolchain.toml` pins the version and rustup honours it, so
      # CI and a developer's machine lint with the same ruler. They did not, once — see that
      # file — and a lint verdict measured with a different compiler than CI runs is a
      # verdict about the wrong thing.
      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ubuntu-24.04-x86_64-unknown-linux-gnu-tests-v1

      # Same package list and pins as build-linux.yml's Ubuntu 24.04 step.
      - name: Install dependencies (Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # The environment this run's results are properties of (#42, ADR 0019). Placed after
      # every tool is installed and before anything is measured, so the numbers below it are
      # attributable. It never fails: absent tools -- there is no sound server, no display and
      # no ffmpeg on a runner -- are recorded as `absent`, which is the comparison that matters
      # against a developer machine where they are present.
      - name: Environment record
        run: scripts/environment-record.sh

      - name: Frontend unit tests
        working-directory: frontend
        run: pnpm test

      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm typecheck

      # eslint, with `--max-warnings=0` inside the script: eslint exits 0 on warnings, so a
      # rule set to `warn` would report and pass — reported and ignored, which is what #34
      # fixed for rustc and #35 must not reintroduce for JavaScript. A step of its own for
      # the same reason as the Rust deny: a lint failure and a test failure must not look
      # the same in a log.
      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint

      # Same step as build-linux.yml: the app's build script copies the sidecar
      # as an external binary and fails when it is missing.
      - name: Build llama-helper sidecar
        run: |
          cargo build --release -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      # Deny rustc's own warnings. A separate step on purpose: a lint failure and a test
      # failure must not look the same in the log. `RUSTFLAGS` is set here rather than at
      # workflow or job `env:` level so a later step (a clippy adoption, #36) does not
      # inherit it and turn its own warnings into errors all at once.
      #
      # `build.rs`'s `unexpected_cfgs` had to be fixed before this deny reached the crate at
      # all: the build script died, so the crate holding sixteen of the eighteen warnings was
      # never checked (ADR 0017). A future rustc that widens a default lint can still turn
      # `main` red with no code change — the toolchain pin above makes that a deliberate bump
      # rather than a surprise, and the remedy is never to delete this step.
      - name: Rust lints (deny warnings)
        run: RUSTFLAGS="-D warnings" cargo check --workspace --all-targets

      # clippy, denied (#36, ADR 0018). Its policy lives in `[workspace.lints.clippy]` in
      # the root Cargo.toml rather than in flags here, so it is part of the crate graph and
      # does not bust the cargo cache the way a second RUSTFLAGS set would. `-D warnings`
      # on the command line is what turns the remaining lints into failures.
      - name: Rust clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        run: cargo test --workspace
