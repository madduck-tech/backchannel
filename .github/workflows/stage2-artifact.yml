name: Stage 2 artifact

# The AppImage a Stage 2 pass is run against, built by a machine instead of a person (#43).
#
# Why this exists: every Stage 2 observation in this repository's history was made on one
# laptop, by hand. Sixteen stage 2 entries; 5-12 need a display and 13-16 need a live
# PipeWire session, so those stay on a real machine. Entries 1-4 need neither, and entry 3 --
# the AppImage build -- is 8.7 min of the ~9-13 min an observation costs (49 s Next.js,
# 471 s `tauri build`, measured on 4daa4af with warm caches). Moving it here means a person's
# Stage 2 starts at entry 5 with a downloaded artifact.
#
# What this is NOT: a Stage 2 pass. Nothing here drives the application, records audio or
# reads a transcript. `scripts/stage2-ui-check.sh` cannot run on a stock runner -- it asserts
# the system-audio picker offers more than the default (`:228`) and only sink monitors enter
# that list, and a runner has no sound server -- so a job that "ran the UI check" here would
# die for a reason unrelated to the UI and its control would go red for the wrong reason.
# That is written down in #43 so nobody retries it without reading why.
#
# Not a required status check on `main`, deliberately: it takes ~9 min against the suites'
# ~4, and blocking every merge on it buys nothing that the suites do not already prove. It
# runs on every pull request so the artifact exists when it is wanted.

on:
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    name: AppImage for Stage 2
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The same literal as test.yml, for the same reason (ADR 0018): a lint or a build
      # measured with a different compiler than the one that gates a pull request is a
      # measurement of the wrong thing.
      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ubuntu-24.04-x86_64-unknown-linux-gnu-appimage-v1

      # Same package list and pins as test.yml and build-linux.yml's Ubuntu 24.04 step,
      # plus FUSE, which appimagetool needs and `cargo test` does not.
      - name: Install dependencies (Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev \
            fuse libfuse2 xvfb dbus-x11 \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2 \
            webkit2gtk-driver=2.44.0-2

      # #101. `tauri-driver` proxies WebDriver to WebKitWebDriver and launches the application; it is
      # the mechanism `scripts/stage2-ui-check.sh` rests on, and it has never run on a runner --
      # `grep -rn "tauri-driver" .github/workflows/` was 0 before this. It is a compile, not a
      # download, so it is a real cost and is named rather than hidden; the Rust cache above covers
      # its dependencies and `--locked` keeps it reproducible.
      #
      # `webkit2gtk-driver` is pinned to 2.44.0-2 with everything else. A driver from a different
      # WebKit than the one the AppImage links would answer a different question.
      - name: Install tauri-driver (#101)
        run: cargo install tauri-driver --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # gopnik.json stage 2, entry 2, verbatim. `build.rs` resolves externalBin through
      # tauri-utils and fails with ResourcePathNotFound when this is missing, so a job
      # without it fails on setup rather than on code.
      - name: Build llama-helper sidecar
        run: |
          cargo build --release -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      # gopnik.json stage 2, entry 3, verbatim -- and `stage2-artifact-matches-the-gate`
      # asserts the two strings are identical. If CI built the AppImage with different
      # flags, a person downloading it would be running Stage 2 against something the gate
      # never described, which is worse than building it themselves.
      - name: Build the AppImage
        run: cd frontend && npx --yes pnpm@11 run build && ./node_modules/.bin/tauri build --bundles appimage --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}' && git rev-parse HEAD > "$(ls -t target/release/bundle/appimage/*.AppImage | head -1).built-from"

      # A bundle step that produces nothing still exits 0 in some tauri failure modes, so
      # assert the file rather than the command's return value -- `.claude/rules/testing.md`,
      # "a call that returns success is not evidence it did anything".
      - name: Assert the artifact exists and is executable
        run: |
          APP=$(ls -t target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
          [ -n "$APP" ] || { echo "no AppImage under target/release/bundle/appimage/"; ls -laR target/release/bundle 2>/dev/null; exit 1; }
          [ -x "$APP" ] || { echo "$APP is not executable"; exit 1; }
          echo "built $APP ($(du -h "$APP" | cut -f1))"
          echo "APPIMAGE=$APP" >> "$GITHUB_ENV"

      # #103. The build step writes `git rev-parse HEAD` beside the bundle, and that command must
      # stay byte-identical to gopnik.json stage 2 entry 3 -- `stage2-artifact-matches-the-gate.test.mjs`
      # asserts it. But on `pull_request` this checkout's HEAD is the **merge commit**: measured on
      # run 34044890650, `head_sha` was 7cc9e07f while `github.sha` was 1bce9414, a merge of 7cc9e07f
      # into 292b99a5, and `git cat-file -t 1bce9414` on a developer's clone answers "not a valid
      # object name". A person who downloads this artifact and checks out the branch has the HEAD
      # commit, not the merge, so a provenance file naming the merge would fail the identity check for a
      # reason that is not a defect.
      #
      # So the build writes the command the gate pins, and this step corrects it to the revision a
      # downloader will actually be sitting on. Separate step on purpose: the pinned command must not
      # grow a CI-only branch.
      - name: Record the revision a downloader will compare against
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          printf '%s\n' "$SHA" > "$APPIMAGE.built-from"
          echo "artifact identity: $SHA (workflow HEAD is $(git rev-parse HEAD))"

      # #107. A page of every component, drawn inside the provider stack the application itself
      # mounts, with the application's own compiled stylesheets inlined. The AppImage above already
      # shows anything reachable *by using* the app; this shows what you cannot navigate to -- the
      # onboarding steps without re-onboarding, dialogs, error and empty states.
      #
      # It lives here rather than in `test.yml` for a measured reason: 78 cards is 96 s against that
      # suite's 12 s, and `test.yml` is the only required status check on `main`. It also needs the
      # stylesheets, which only a `pnpm build` produces -- and the step above just did one.
      #
      # A NEW step on purpose. The build command above is pinned byte-identical to gopnik.json stage
      # 2 entry 3 and asserted by `stage2-artifact-matches-the-gate.test.mjs`; extending it would
      # break that coupling.
      #
      # This one FAILS the job on three things, each a way the page could lie: no cards at all, no
      # stylesheets, or a component that used to draw and no longer does. A picture is not an
      # assertion, but an empty or unstyled picture is worse than none.
      - name: Draw every component
        run: cd frontend && GALLERY_OUT=gallery.html node tests/lib/gallery.mjs

      - name: Publish the component gallery
        uses: actions/upload-artifact@v4
        with:
          name: backchannel-gallery-${{ github.sha }}
          path: frontend/gallery.html
          if-no-files-found: error
          retention-days: 14

      # #67 conditions 1 and 2, and the observation #5 could not be made without.
      #
      # The `.deb` is built here and installed in a CLEAN container — not on this runner, which has
      # every build dependency and would pass while the package is still broken. That is the whole
      # point of the check and not a detail of how it is run: #5 (`libopenblas.so.0` linked and
      # undeclared) was found by hand, once, on a bundle somebody had to produce by hand first.
      #
      # Unlike the headless probe below, this one FAILS. A package that cannot be installed, or
      # that installs and cannot start, is a release nobody should be able to cut.
      - name: Build the .deb
        run: cd frontend && ./node_modules/.bin/tauri build --bundles deb --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'

      - name: Install the .deb in a clean container and launch it
        run: scripts/deb-install-check.sh "$(ls -t target/release/bundle/deb/*.deb | head -1)" 20

      # #67 condition 0: can this application start with no desktop at all? Every other
      # condition in that issue rests on the answer and nothing in this repository has ever
      # measured it. A measurement, not a check — the probe always exits 0 and prints a verdict,
      # because the honest answer might be "no" and a probe that fails the build when the answer
      # is no is a probe nobody can afford to run.
      #
      # #43 already refuted the nearest neighbour: `stage2-ui-check.sh` under xvfb dies because a
      # runner has no sink monitors. This asks a narrower question — no audio, no WebDriver, no
      # interaction — and it asks it here rather than assuming an answer in an issue.
      - name: Probe whether the application starts headless
        run: scripts/headless-launch-probe.sh "$APPIMAGE" 25

      # #101. Nothing has ever established that this application's webview loads on a machine.
      # `headless-launch-probe.sh` above asserts a live process and two greps of stdout --
      # `Application setup complete` is `lib.rs:433`, the third statement in `.setup()`, and the
      # database init that can still panic is 74 lines later. Nothing in the tree logs a
      # window-ready or webview-loaded signal, so that probe could not have asserted a render even in
      # principle. A WebDriver needs a loaded webview, not a live process.
      #
      # A measurement, not a check: always exits 0 and prints one `verdict=` line, the ADR 0019
      # shape. The honest answer may be "no", and a probe that fails the build when the answer is no
      # is one nobody can afford to run.
      #
      # It takes "$APPIMAGE" directly rather than `scripts/stage2-locate-app.sh`. In this workflow
      # the provenance file is deliberately the head SHA while `git rev-parse HEAD` is the merge
      # commit, so the locator would `die` for a reason that is not a defect -- the same reason the
      # headless probe above takes it directly.
      - name: Probe whether the webview loads under WebDriver
        run: scripts/webdriver-probe.sh "$APPIMAGE"

      - name: Publish the artifact
        uses: actions/upload-artifact@v4
        with:
          name: backchannel-appimage-${{ github.sha }}
          # Both files. Before #103 this published the AppImage alone, flattened to a single zip
          # entry -- measured on run 34044890650: EOCD reported 1 entry, no directory prefix. Nothing
          # travelled with it to say which revision it was, and the gate's five `ls -t` locators had
          # no way to consume it anyway.
          path: |
            ${{ env.APPIMAGE }}
            ${{ env.APPIMAGE }}.built-from
          if-no-files-found: error
          retention-days: 14
